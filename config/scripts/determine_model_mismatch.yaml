    overwrite: false
    automatic: true
    automatic_first_offset_dist: 0.5

  processing:
    ts: 0.002 # interpolation time

model:
  name: "falcon"
  quad_number: 7

mhe:
  generate_solver: true
  n_iter: 10
  n_times: 0
  M: 40
  stage_est: 20
  eps: 1e-9
  cost_scaling: 1
  update_Q: true
  update_R: true
  determine_w: false # if true, the script will use a different solver to determine disturbance vector w from data
  use_predetermined_w: true # if true, the script will use predetermined disturbance vector w

printing:
  disturbances:
    min: true
    max: true
    bias: true
  meas_noises:
    min: true
    max: true

plotting:
  raw_interp_inputs: false
  raw_interp_outputs: false
  raw_interp_disturbances: false
  raw_interp_meas_noises: false
